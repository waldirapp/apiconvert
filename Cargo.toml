[package]
name = "xlsconvert"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Conversão de planilha .xls/.xlsx em .xlsx com o mesmo resultado de pandas.read_excel + DataFrame.to_excel (pandas 2.2.3) e de imagem em WebP como o cwebp"
license = "MIT"
repository = "https://github.com/waldirapp/apiconvert"
publish = false

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
http-body = "1"
calamine = { version = "0.36", features = ["dates"] }
cfb = "0.15"
rust_xlsxwriter = "0.99"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
libwebp-sys = { version = "0.14", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp", "ico"] }
base64 = "0.23"
askama = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
